<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">떨림의 원인 — 남은 공간을 매 프레임 재서 상자 높이가 바뀜 (세로축 = 화면, 애니메이션)</title>
  <desc id="d">키보드 뜬 채 스크롤하면 커서가 오르내리고 커서 아래 남은 공간(주황 점선)이 계속 바뀐다. 왼쪽 고치기 전은 상자가 그 공간에 맞춰 크기가 늘었다 줄었다 하며 떨린다. 오른쪽 고친 뒤는 남은 공간이 똑같이 바뀌어도 상자는 70으로 고정이고 위치만 따라간다</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:14px; font-weight:700; }
    .ts { fill:#111827; font-size:12px; }
    .tm { fill:#6b7280; font-size:11px; }
    .frame { fill:none; stroke:#9ca3af; stroke-width:1.5; }
    .line { stroke:#d1d5db; stroke-width:4; stroke-linecap:round; }
    .kb { fill:#d1d5db; opacity:.6; }
    .caret { stroke:#2563eb; stroke-width:2; }
    .avail { fill:#fff7ed; fill-opacity:.4; stroke:#f97316; stroke-width:1.5; stroke-dasharray:4 3; }
    .box { fill:#fee2e2; stroke:#dc2626; stroke-width:1.5; } .boxt { fill:#991b1b; font-size:11px; font-weight:600; }
    .boxok { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.5; } .boxokt { fill:#134e4a; font-size:11px; font-weight:600; }
    .lab { fill:#dc2626; font-size:11px; } .labg { fill:#0f766e; font-size:11px; } .labo { fill:#c2410c; font-size:11px; }
    .concl { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; } .conclt { fill:#134e4a; font-size:12px; font-weight:600; }
    /* 커서 y: 스크롤 흉내 (불규칙하게 오르내림) */
    .caret-a, .avail-a, .box-a, .boxok-a, .caret-b, .avail-b { animation-duration: 5s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .caret-a { animation-name: caretY; } .caret-b { animation-name: caretY; }
    .avail-a { animation-name: availA; } .avail-b { animation-name: availA; }
    .box-a { animation-name: boxA; animation-timing-function: steps(10, end); }
    .jit { animation: jit .14s linear infinite; }
    @keyframes jit { 0% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(3px) scaleY(0.96); } 100% { transform: translateY(0) scaleY(1); } }
    .boxok-a { animation-name: boxB; }
    /* 커서 위치 y (라인 기준) : 130 → 200 → 160 → 215 → 145 → 130 */
    @keyframes caretY { 0% { transform: translateY(0); } 25% { transform: translateY(70px); } 45% { transform: translateY(30px); } 70% { transform: translateY(85px); } 88% { transform: translateY(15px); } 100% { transform: translateY(0); } }
    /* 남은 공간: y=caret+20, 높이 = 274 - y */
    @keyframes availA { 0% { transform: translateY(0) scaleY(1); } 25% { transform: translateY(70px) scaleY(0.435); } 45% { transform: translateY(30px) scaleY(0.758); } 70% { transform: translateY(85px) scaleY(0.314); } 88% { transform: translateY(15px) scaleY(0.879); } 100% { transform: translateY(0) scaleY(1); } }
    @keyframes boxA { 0% { transform: translateY(0) scaleY(1); } 25% { transform: translateY(70px) scaleY(0.435); } 45% { transform: translateY(30px) scaleY(0.758); } 70% { transform: translateY(85px) scaleY(0.314); } 88% { transform: translateY(15px) scaleY(0.879); } 100% { transform: translateY(0) scaleY(1); } }
    @keyframes boxB { 0% { transform: translateY(0); } 25% { transform: translateY(70px); } 45% { transform: translateY(30px); } 70% { transform: translateY(85px); } 88% { transform: translateY(15px); } 100% { transform: translateY(0); } }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .frame { stroke:#6b7280; } .line { stroke:#374151; } .kb { fill:#4b5563; } .caret { stroke:#60a5fa; }
      .avail { fill:#3b2a12; stroke:#fb923c; }
      .box { fill:#7f1d1d; stroke:#f87171; } .boxt { fill:#fecaca; }
      .boxok { fill:#134e4a; stroke:#2dd4bf; } .boxokt { fill:#ccfbf1; }
      .lab { fill:#f87171; } .labg { fill:#2dd4bf; } .labo { fill:#fdba74; }
      .concl { fill:#134e4a; stroke:#2dd4bf; } .conclt { fill:#ccfbf1; }
    }
    @media (prefers-reduced-motion: reduce) { .caret-a,.avail-a,.box-a,.boxok-a,.caret-b,.avail-b,.jit { animation: none; } }
  </style>

  <text class="th" x="340" y="24" text-anchor="middle">세로축 = 화면 · 키보드 뜬 채 스크롤 중 (커서가 오르내림)</text>
  <text class="tm" x="340" y="42" text-anchor="middle">주황 점선 = 커서 아래에서 키보드까지 비어 있는 자리 (남은 공간)</text>

  <!-- 왼쪽: 고치기 전 -->
  <text class="th" x="170" y="70" text-anchor="middle">고치기 전 — 상자가 남은 공간을 따라감</text>
  <rect class="frame" x="100" y="80" width="140" height="240" rx="12"/>
  <line class="line" x1="114" y1="98" x2="226" y2="98"/>
  <rect class="kb" x="101" y="274" width="138" height="45"/><text class="tm" x="170" y="300" text-anchor="middle">키보드</text>
  <g class="caret-a"><line class="caret" x1="122" y1="112" x2="122" y2="128"/></g>
  <!-- 남은 공간: y 132~274 (142). scale 기준점 위 -->
  <g class="avail-a" style="transform-origin: 170px 132px;"><rect class="avail" x="106" y="132" width="128" height="142"/></g>
  <g class="box-a" style="transform-origin: 170px 136px;"><g class="jit" style="transform-origin: 170px 136px;"><rect class="box" x="112" y="136" width="116" height="134" rx="4"/></g></g>
  <g class="box-a" style="transform-origin: 170px 136px;"><text class="boxt" x="170" y="150" text-anchor="middle">상자 = 남은 공간</text></g>
  <text class="lab" x="170" y="345" text-anchor="middle">남은 공간을 매 프레임 다시 재서</text>
  <text class="lab" x="170" y="361" text-anchor="middle">한 박자 늦게 툭툭 따라감 = 떨림</text>

  <!-- 오른쪽: 고친 뒤 -->
  <text class="th" x="510" y="70" text-anchor="middle">고친 뒤 — 상자는 70 고정, 위치만 따라감</text>
  <rect class="frame" x="440" y="80" width="140" height="240" rx="12"/>
  <line class="line" x1="454" y1="98" x2="566" y2="98"/>
  <rect class="kb" x="441" y="274" width="138" height="45"/><text class="tm" x="510" y="300" text-anchor="middle">키보드</text>
  <g class="caret-b"><line class="caret" x1="462" y1="112" x2="462" y2="128"/></g>
  <g class="avail-b" style="transform-origin: 510px 132px;"><rect class="avail" x="446" y="132" width="128" height="142"/></g>
  <g class="boxok-a"><rect class="boxok" x="452" y="136" width="116" height="34" rx="4"/><text class="boxokt" x="510" y="157" text-anchor="middle">상자 70</text></g>
  <text class="labg" x="510" y="345" text-anchor="middle">남은 공간은 똑같이 바뀌지만</text>
  <text class="labg" x="510" y="361" text-anchor="middle">상자는 70 그대로 = 안 흔들림</text>

  <rect class="concl" x="90" y="390" width="500" height="30" rx="8"/>
  <text class="conclt" x="340" y="410" text-anchor="middle">남은 공간이 바뀌는 건 똑같음 · 거기에 상자 크기를 맞추느냐, 고정하느냐의 차이</text>
</svg>
