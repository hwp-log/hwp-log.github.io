<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" width="680" height="306" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">목록 상자 — 높이 70px 고정, 안에서 스크롤</title>
  <desc id="d">상자 높이는 70px로 고정이고 그 안에 한 행과 다음 행 윗부분이 걸쳐 보인다. 항목이 열다섯 개여도 상자는 커지지 않고 안에서 스크롤한다. 다음 행이 보여야 더 있다는 걸 알고 스크롤한다</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:14px; font-weight:700; }
    .ts { fill:#111827; font-size:12px; }
    .tm { fill:#6b7280; font-size:11px; }
    .box-out { fill:#f9fafb; stroke:#0f766e; stroke-width:2; }
    .row { fill:#ffffff; stroke:#e5e7eb; stroke-width:1; }
    .rowt { fill:#1f2937; font-size:12px; font-weight:600; }
    .rowd { fill:#9ca3af; font-size:10px; }
    .icon { fill:#e5e7eb; }
    .hidden { fill:#f3f4f6; stroke:#e5e7eb; stroke-width:1; }
    .dim { fill:#c7cbd1; font-size:12px; }
    .arr { stroke:#6b7280; stroke-width:1.2; fill:none; }
    .labg { fill:#0f766e; font-size:11px; } .lab { fill:#c2410c; font-size:11px; font-weight:600; }
    .cut { stroke:#c2410c; stroke-width:1.5; stroke-dasharray:5 4; }
    .box { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; } .boxt { fill:#134e4a; font-size:12px; font-weight:600; }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .box-out { fill:#111827; stroke:#2dd4bf; }
      .row { fill:#1f2937; stroke:#374151; } .rowt { fill:#e5e7eb; } .rowd { fill:#9ca3af; }
      .icon { fill:#374151; } .hidden { fill:#1a2230; stroke:#374151; } .dim { fill:#4b5563; }
      .arr { stroke:#9ca3af; } .labg { fill:#2dd4bf; } .lab { fill:#fdba74; } .cut { stroke:#fdba74; }
      .box { fill:#134e4a; stroke:#2dd4bf; } .boxt { fill:#ccfbf1; }
    }
  </style>
  <defs>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <clipPath id="clip70"><rect x="140" y="80" width="300" height="70" rx="8"/></clipPath>
  </defs>

  <text class="th" x="340" y="28" text-anchor="middle">항목이 몇 개든 상자 높이는 70px 하나</text>

  <!-- 눈금 -->
  <line class="cut" x1="120" y1="80" x2="460" y2="80"/>
  <line class="cut" x1="120" y1="150" x2="460" y2="150"/>
  <text class="lab" x="112" y="84" text-anchor="end">0</text>
  <text class="lab" x="112" y="154" text-anchor="end">70</text>
  <line class="arr" x1="128" y1="82" x2="128" y2="148" marker-start="url(#ma)" marker-end="url(#ma)"/>

  <!-- 상자 -->
  <rect class="box-out" x="140" y="80" width="300" height="70" rx="8"/>
  <g clip-path="url(#clip70)">
    <rect class="row" x="146" y="86" width="288" height="44" rx="6"/>
    <rect class="icon" x="156" y="96" width="24" height="24" rx="5"/>
    <text class="rowt" x="192" y="105">굵게</text>
    <text class="rowd" x="192" y="120">진하게 강조</text>
    <rect class="row" x="146" y="134" width="288" height="44" rx="6"/>
    <rect class="icon" x="156" y="144" width="24" height="24" rx="5"/>
    <text class="rowt" x="192" y="153">기울임</text>
  </g>
  <text class="labg" x="468" y="100">← 한 행</text>
  <text class="labg" x="468" y="146">← 다음 행이 살짝 걸침</text>
  <text class="tm" x="468" y="160">"아래로 더 있구나"</text>

  <!-- 상자 아래: 안 보이는 나머지 -->
  <text class="tm" x="140" y="176">상자 밖 (안에서 스크롤하면 올라옴)</text>
  <rect class="hidden" x="146" y="184" width="288" height="26" rx="5"/><text class="dim" x="192" y="201">인용</text>
  <rect class="hidden" x="146" y="214" width="288" height="26" rx="5"/><text class="dim" x="192" y="231">이미지</text>
  <rect class="hidden" x="146" y="244" width="288" height="26" rx="5"/><text class="dim" x="192" y="261">구분선</text>
  <text class="dim" x="192" y="284">…</text>
  <text class="tm" x="468" y="230">항목은 열다섯 개까지</text>
  <text class="tm" x="468" y="244">상자는 그대로 70px</text>

</svg>
