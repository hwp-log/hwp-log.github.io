<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">케이스 1 — 키보드가 올라오면 height만 줄고 offsetTop은 0 그대로 (세로축 = 문서)</title>
  <desc id="d">왼쪽 키보드 전: 창이 문서 0~750, height 750, offsetTop 0, 툴바 750. 오른쪽 키보드 후: 키보드가 문서 450~750을 덮어 창이 0~450으로 줄어듦, height 450, offsetTop 0 그대로, 툴바를 450으로 밀어야 함</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:14px; font-weight:700; }
    .ts { fill:#111827; font-size:12px; }
    .tm { fill:#6b7280; font-size:11px; }
    .axis { stroke:#9ca3af; stroke-width:1; }
    .doc { fill:#f3f4f6; stroke:#9ca3af; stroke-width:1; }
    .line { stroke:#d1d5db; stroke-width:4; stroke-linecap:round; }
    .vv { fill:#fff7ed; stroke:#f97316; stroke-width:2; stroke-dasharray:5 4; fill-opacity:.6; }
    .vvt { fill:#9a3412; font-size:11px; }
    .kb { fill:#d1d5db; opacity:.75; }
    .tb { fill:#fee2e2; stroke:#dc2626; stroke-width:1.2; } .tbt { fill:#991b1b; font-size:11px; font-weight:600; }
    .ghost { fill:none; stroke:#0f766e; stroke-width:1; stroke-dasharray:3 2; } .ghostt { fill:#0f766e; font-size:10px; }
    .box { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; } .boxt { fill:#134e4a; font-size:12px; font-weight:600; }
    .arr { stroke:#6b7280; stroke-width:1.2; fill:none; }
    .lab { fill:#dc2626; font-size:11px; } .labg { fill:#0f766e; font-size:11px; } .labo { fill:#c2410c; font-size:11px; font-weight:600; }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .axis { stroke:#6b7280; } .doc { fill:#1f2937; stroke:#6b7280; } .line { stroke:#374151; }
      .vv { fill:#3b2a12; stroke:#fb923c; } .vvt { fill:#fdba74; }
      .kb { fill:#4b5563; }
      .tb { fill:#7f1d1d; stroke:#f87171; } .tbt { fill:#fecaca; }
      .ghost { stroke:#2dd4bf; } .ghostt { fill:#2dd4bf; }
      .box { fill:#134e4a; stroke:#2dd4bf; } .boxt { fill:#ccfbf1; }
      .arr { stroke:#9ca3af; } .lab { fill:#f87171; } .labg { fill:#2dd4bf; } .labo { fill:#fdba74; }
    }
  </style>
  <defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text class="th" x="340" y="24" text-anchor="middle">세로축 = 문서 (문서는 고정, 창이 움직임)</text>

  <text class="th" x="170" y="52" text-anchor="middle">키보드 올라오기 전</text>
  <line class="axis" x1="70" y1="70.0" x2="70" y2="370.0"/>
  <text class="ts" x="62" y="75.0" text-anchor="end">0</text><text class="ts" x="62" y="375.0" text-anchor="end">750</text>
  <rect class="doc" x="80" y="70.0" width="120" height="300.0" rx="4"/><line class="line" x1="96" y1="86.0" x2="184" y2="86.0"/><line class="line" x1="96" y1="106.0" x2="170" y2="106.0"/><line class="line" x1="96" y1="126.0" x2="184" y2="126.0"/><line class="line" x1="96" y1="150.0" x2="160" y2="150.0"/><line class="line" x1="96" y1="294.0" x2="184" y2="294.0"/><line class="line" x1="96" y1="326.0" x2="170" y2="326.0"/><line class="line" x1="96" y1="350.0" x2="184" y2="350.0"/>
  <rect class="vv" x="76" y="72.0" width="128" height="296.0" rx="4"/>
  <text class="vvt" x="140" y="190.0" text-anchor="middle">창 0~750</text>
  <rect class="tb" x="86" y="352.0" width="108" height="14" rx="3"/><text class="tbt" x="140" y="363.0" text-anchor="middle">툴바 750</text>
  <text class="lab" x="212" y="75.0">← 창 윗변 = 0</text><text class="tm" x="212" y="89.0">offsetTop 0</text>
  <text class="labo" x="212" y="190.0">height 750</text>
  <text class="labg" x="212" y="375.0">← 창 아랫변 = 750</text><text class="tm" x="212" y="389.0">= 0 + 750</text>

  <line class="arr" x1="330" y1="220" x2="380" y2="220" marker-end="url(#ma)"/>
  <text class="tm" x="355" y="210" text-anchor="middle">키보드 ↑</text>

  <text class="th" x="510" y="52" text-anchor="middle">키보드 올라온 후</text>
  <line class="axis" x1="410" y1="70.0" x2="410" y2="370.0"/>
  <text class="ts" x="402" y="75.0" text-anchor="end">0</text><text class="ts" x="402" y="255.0" text-anchor="end">450</text><text class="ts" x="402" y="375.0" text-anchor="end">750</text>
  <rect class="doc" x="420" y="70.0" width="120" height="300.0" rx="4"/><line class="line" x1="436" y1="86.0" x2="524" y2="86.0"/><line class="line" x1="436" y1="106.0" x2="510" y2="106.0"/><line class="line" x1="436" y1="126.0" x2="524" y2="126.0"/><line class="line" x1="436" y1="150.0" x2="500" y2="150.0"/>
  <rect class="vv" x="416" y="72.0" width="128" height="176.0" rx="4"/>
  <text class="vvt" x="480" y="150.0" text-anchor="middle">창 0~450</text>
  <rect class="kb" x="420" y="250.0" width="120" height="120.0" rx="0"/>
  <text class="ts" x="480" y="310.0" text-anchor="middle">키보드</text>
  <rect class="ghost" x="426" y="352.0" width="108" height="14" rx="3"/><text class="ghostt" x="480" y="363.0" text-anchor="middle">원래 자리 750</text>
  <rect class="tb" x="426" y="232.0" width="108" height="14" rx="3"/><text class="tbt" x="480" y="243.0" text-anchor="middle">툴바 → 450</text>
  <text class="lab" x="552" y="75.0">← 창 윗변 = 0</text><text class="tm" x="552" y="89.0">offsetTop 0 (그대로)</text>
  <text class="labo" x="552" y="150.0">height 450 (줄어듦)</text>
  <text class="labg" x="552" y="255.0">← 창 아랫변 = 450</text><text class="tm" x="552" y="269.0">= 0 + 450</text>
  <text class="tm" x="552" y="310.0">키보드 450~750</text>

  <rect class="box" x="90" y="398" width="500" height="30" rx="8"/>
  <text class="boxt" x="340" y="418" text-anchor="middle">키보드는 height만 750 → 450으로 줄임 · offsetTop은 0 그대로</text>
</svg>