<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">키보드가 올라오면 블록 목록이 가려진다</title>
  <desc id="d">모바일 편집 화면에서 슬래시를 치면 세로 블록 목록이 뜨는데, 키보드가 올라오면 목록 대부분이 키보드 뒤로 숨는 장면을 반복 재생한다.</desc>
  <style>
    svg {
      --frame: #9ca3af; --body: #d1d5db; --ink: #111827; --muted: #6b7280;
      --menu-bg: #f9fafb; --menu-line: #0284c7; --menu-ink: #1f2937;
      --kb-bg: #e5e7eb; --kb-key: #ffffff; --kb-edge: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --frame: #6b7280; --body: #374151; --ink: #e5e7eb; --muted: #9ca3af;
        --menu-bg: #1f2937; --menu-line: #38bdf8; --menu-ink: #e5e7eb;
        --kb-bg: #374151; --kb-key: #4b5563; --kb-edge: #fbbf24;
      }
    }
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 2; }
    .body { stroke: var(--body); stroke-width: 6; stroke-linecap: round; }
    .slash { fill: var(--ink); font-size: 18px; font-weight: 600; }
    .caret { fill: var(--ink); animation: blink 1s steps(2, start) infinite; }
    .menu { fill: var(--menu-bg); stroke: var(--menu-line); stroke-width: 1.5; }
    .menu-icon { fill: var(--menu-line); opacity: .7; }
    .menu-text { fill: var(--menu-ink); font-size: 12px; }
    .kb-bg { fill: var(--kb-bg); }
    .kb-key { fill: var(--kb-key); }
    .kb-edge { stroke: var(--kb-edge); stroke-width: 2; stroke-dasharray: 4 4; }
    .cap { fill: var(--ink); font-size: 14px; }
    .cap-sub { fill: var(--muted); font-size: 12px; }
    .kb { animation: kb 6s ease-in-out infinite; }
    .cap-a { animation: capA 6s ease-in-out infinite; }
    .cap-b { animation: capB 6s ease-in-out infinite; }
    .avail { animation: capB 6s ease-in-out infinite; }
    .avail-label { fill: #f97316; font-size: 12px; font-weight: 700; }
    @keyframes kb {
      0%, 25% { transform: translateY(0); }
      37%, 82% { transform: translateY(-220px); }
      94%, 100% { transform: translateY(0); }
    }
    @keyframes capA {
      0%, 25% { opacity: 1; }
      37%, 82% { opacity: 0; }
      94%, 100% { opacity: 1; }
    }
    @keyframes capB {
      0%, 25% { opacity: 0; }
      37%, 82% { opacity: 1; }
      94%, 100% { opacity: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .kb { animation: none; transform: translateY(-220px); }
      .cap-a { animation: none; opacity: 0; }
      .cap-b { animation: none; opacity: 1; }
      .avail { animation: none; opacity: 1; }
      .caret { animation: none; }
    }
  </style>
  <defs>
    <pattern id="orange-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#f97316" stroke-width="2"/></pattern>
    <clipPath id="screen"><rect x="22" y="22" width="256" height="436" rx="26"/></clipPath>
    <pattern id="keys" x="30" y="0" width="26" height="40" patternUnits="userSpaceOnUse">
      <rect class="kb-key" x="2" y="6" width="22" height="30" rx="4"/>
    </pattern>
  </defs>

  <!-- 폰 프레임 -->
  <rect class="frame" x="20" y="20" width="260" height="440" rx="28"/>

  <g clip-path="url(#screen)">
    <!-- 본문 줄 -->
    <line class="body" x1="50" y1="70" x2="230" y2="70"/>
    <line class="body" x1="50" y1="95" x2="230" y2="95"/>
    <line class="body" x1="50" y1="120" x2="230" y2="120"/>
    <line class="body" x1="50" y1="145" x2="190" y2="145"/>

    <!-- 슬래시 + 커서 -->
    <text class="slash" x="50" y="178">/</text>
    <rect class="caret" x="63" y="164" width="2" height="18"/>

    <!-- 슬래시 메뉴 (세로 팝업) -->
    <rect class="menu" x="50" y="190" width="170" height="210" rx="8"/>
    <g class="menu-text">
      <rect class="menu-icon" x="62" y="200" width="12" height="12" rx="2"/><text x="82" y="210">제목</text>
      <rect class="menu-icon" x="62" y="228" width="12" height="12" rx="2"/><text x="82" y="238">글머리 목록</text>
      <rect class="menu-icon" x="62" y="256" width="12" height="12" rx="2"/><text x="82" y="266">번호 목록</text>
      <rect class="menu-icon" x="62" y="284" width="12" height="12" rx="2"/><text x="82" y="294">인용</text>
      <rect class="menu-icon" x="62" y="312" width="12" height="12" rx="2"/><text x="82" y="322">이미지</text>
      <rect class="menu-icon" x="62" y="340" width="12" height="12" rx="2"/><text x="82" y="350">구분선</text>
      <rect class="menu-icon" x="62" y="368" width="12" height="12" rx="2"/><text x="82" y="378">코드</text>
    </g>

    <!-- 키보드가 올라온 뒤 실제로 쓸 수 있는 영역 -->
    <g class="avail">
      <rect x="22" y="22" width="256" height="218" fill="url(#orange-hatch)" opacity=".28"/>
      <rect x="22" y="22" width="256" height="218" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4"/>
      <rect x="86" y="30" width="128" height="20" rx="4" fill="#f97316" opacity=".95"/>
      <text class="avail-label" x="150" y="44" text-anchor="middle" style="fill:#fff">소화 가능 영역</text>
    </g>

    <!-- 키보드: 폰 바닥 아래에서 올라옴 -->
    <g class="kb">
      <rect class="kb-bg" x="22" y="460" width="256" height="220"/>
      <line class="kb-edge" x1="22" y1="461" x2="278" y2="461"/>
      <rect x="22" y="466" width="256" height="120" fill="url(#keys)"/>
      <rect class="kb-key" x="70" y="596" width="160" height="30" rx="4"/>
    </g>
  </g>

  <!-- 캡션 A: 키보드 없을 때 -->
  <g class="cap-a">
    <text class="cap" x="300" y="200">슬래시를 치면</text>
    <text class="cap" x="300" y="220">블록 목록이 뜹니다.</text>
    <text class="cap-sub" x="300" y="248">데스크톱에서는 이걸로</text>
    <text class="cap-sub" x="300" y="266">충분했습니다.</text>
  </g>

  <!-- 캡션 B: 키보드 올라왔을 때 -->
  <g class="cap-b">
    <text class="cap" x="300" y="200">키보드가 올라오면</text>
    <text class="cap" x="300" y="220">목록 대부분이</text>
    <text class="cap" x="300" y="240">키보드 뒤로 숨습니다.</text>
    <text class="cap-sub" x="300" y="268">자리가 없습니다.</text>
  </g>
</svg>
