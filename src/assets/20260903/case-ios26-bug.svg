<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="680" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">iOS 26 버그 — 키보드를 닫아도 offsetTop이 0으로 안 돌아옴 (세로축 = 문서)</title>
  <desc id="d">양쪽 다 키보드를 닫은 뒤이고 실제 창은 0~750으로 같다. 왼쪽 정상은 offsetTop이 0이라 창 윗변과 일치하고 아랫변 750을 구해 툴바가 제자리. 오른쪽 버그는 offsetTop이 100에 남아 API가 창 윗변을 100으로 말하고, 아랫변을 850으로 계산해 툴바를 창 밖으로 민다</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:14px; font-weight:700; }
    .ts { fill:#111827; font-size:12px; }
    .tm { fill:#6b7280; font-size:11px; }
    .axis { stroke:#9ca3af; stroke-width:1; }
    .doc { fill:#f3f4f6; stroke:#9ca3af; stroke-width:1; }
    .line { stroke:#d1d5db; stroke-width:4; stroke-linecap:round; }
    .vv { fill:#fff7ed; stroke:#f97316; stroke-width:2; stroke-dasharray:5 4; fill-opacity:.6; }
    .vvt { fill:#9a3412; font-size:11px; }
    .ok { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.2; } .okt { fill:#134e4a; font-size:11px; font-weight:600; }
    .tb { fill:#fee2e2; stroke:#dc2626; stroke-width:1.2; } .tbt { fill:#991b1b; font-size:11px; font-weight:600; }
    .val { fill:#111827; font-size:12px; } .valbad { fill:#dc2626; font-size:12px; font-weight:600; }
    .lab { fill:#dc2626; font-size:11px; } .labg { fill:#0f766e; font-size:11px; }
    .card { fill:none; stroke:#9ca3af; stroke-width:1; }
    .offline-ok { stroke:#0f766e; stroke-width:1.5; stroke-dasharray:4 3; }
    .offline-bad { stroke:#dc2626; stroke-width:1.5; stroke-dasharray:4 3; }
    @media (prefers-color-scheme: dark) {
      .th, .ts, .val { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .axis { stroke:#6b7280; } .doc { fill:#1f2937; stroke:#6b7280; } .line { stroke:#374151; }
      .vv { fill:#3b2a12; stroke:#fb923c; } .vvt { fill:#fdba74; }
      .ok { fill:#134e4a; stroke:#2dd4bf; } .okt { fill:#ccfbf1; }
      .tb { fill:#7f1d1d; stroke:#f87171; } .tbt { fill:#fecaca; }
      .valbad { fill:#f87171; } .lab { fill:#f87171; } .labg { fill:#2dd4bf; } .card { stroke:#6b7280; }
      .offline-ok { stroke:#2dd4bf; } .offline-bad { stroke:#f87171; }
    }
  </style>

  <text class="th" x="340" y="28" text-anchor="middle">세로축 = 문서 · 양쪽 다 키보드를 닫은 뒤</text>
  <text class="tm" x="340" y="46" text-anchor="middle">실제 창은 양쪽 모두 0~750으로 같습니다</text>

  <text class="th" x="140" y="76" text-anchor="middle">정상</text>
  <line class="axis" x1="70" y1="90" x2="70" y2="390"/>
  <text class="ts" x="62" y="95" text-anchor="end">0</text><text class="ts" x="62" y="395" text-anchor="end">750</text>
  <rect class="doc" x="80" y="90" width="120" height="300" rx="4"/>
  <line class="line" x1="96" y1="106" x2="184" y2="106"/><line class="line" x1="96" y1="126" x2="170" y2="126"/><line class="line" x1="96" y1="146" x2="184" y2="146"/>
  <rect class="vv" x="76" y="92" width="128" height="296" rx="4"/>
  <line class="offline-ok" x1="76" y1="90" x2="230" y2="90"/>
  <text class="labg" x="234" y="95">offsetTop 0 = 창 윗변</text>
  <text class="vvt" x="140" y="230" text-anchor="middle">창 0~750</text>
  <rect class="ok" x="86" y="372" width="108" height="14" rx="3"/><text class="okt" x="140" y="383" text-anchor="middle">툴바 750</text>
  <text class="labg" x="212" y="395">← 창 아랫변에 딱</text>

  <text class="th" x="480" y="76" text-anchor="middle">iOS 26 버그</text>
  <line class="axis" x1="410" y1="90" x2="410" y2="432"/>
  <text class="ts" x="402" y="95" text-anchor="end">0</text><text class="valbad" x="402" y="135" text-anchor="end">100</text><text class="ts" x="402" y="395" text-anchor="end">750</text>
  <text class="valbad" x="402" y="437" text-anchor="end">850</text>
  <rect class="doc" x="420" y="90" width="120" height="300" rx="4"/>
  <line class="line" x1="436" y1="106" x2="524" y2="106"/><line class="line" x1="436" y1="126" x2="510" y2="126"/><line class="line" x1="436" y1="146" x2="524" y2="146"/>
  <rect class="vv" x="416" y="92" width="128" height="296" rx="4"/>
  <line class="offline-bad" x1="416" y1="130" x2="570" y2="130"/>
  <text class="lab" x="574" y="135">offsetTop 100</text>
  <text class="lab" x="574" y="149">(실제 윗변은 0)</text>
  <text class="vvt" x="480" y="230" text-anchor="middle">창 0~750</text>
  <text class="labg" x="552" y="395">← 창 아랫변 750</text>
  <rect class="tb" x="426" y="414" width="108" height="14" rx="3"/><text class="tbt" x="480" y="425" text-anchor="middle">툴바 850</text>
  <text class="lab" x="552" y="425">← 창 밖 = 화면 밖</text>

  <rect class="card" x="80" y="460" width="240" height="62" rx="6"/>
  <text class="tm" x="94" y="480">API가 보고한 값</text>
  <text class="val" x="94" y="500">offsetTop 0 · height 750</text>
  <text class="val" x="94" y="516">→ 아랫변 0 + 750 = 750 ✓</text>

  <rect class="card" x="380" y="460" width="240" height="62" rx="6"/>
  <text class="tm" x="394" y="480">API가 보고한 값</text>
  <text class="val" x="394" y="500"><tspan class="valbad">offsetTop 100</tspan> · height 750</text>
  <text class="valbad" x="394" y="516">→ 아랫변 100 + 750 = 850 ✗</text>
</svg>