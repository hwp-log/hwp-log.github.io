<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">문제 1 — 키보드 뜬 채 스크롤하면 툴바가 흘러감 (세로축 = 문서)</title>
  <desc id="d">왼쪽: 키보드가 뜨고 툴바를 창 아랫변 450에 밀어둔 직후. 오른쪽: 본문을 100 스크롤하면 창이 문서 위에서 100 내려가 100~550이 되는데 툴바는 450에 그대로라 창 안에서 100 위로 떠 보인다. 다시 550으로 밀어야 하고, 신호가 안 오면 못 민다</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:14px; font-weight:700; }
    .ts { fill:#111827; font-size:12px; }
    .tm { fill:#6b7280; font-size:11px; }
    .axis { stroke:#9ca3af; stroke-width:1; }
    .doc { fill:#f3f4f6; stroke:#9ca3af; stroke-width:1; }
    .frame { fill:none; stroke:#9ca3af; stroke-width:1.5; }
    .line { stroke:#d1d5db; stroke-width:4; stroke-linecap:round; }
    .vv { fill:#fff7ed; stroke:#f97316; stroke-width:2; stroke-dasharray:5 4; fill-opacity:.6; }
    .vvbad { fill:none; stroke:#dc2626; stroke-width:2; stroke-dasharray:5 4; }
    .vvt { fill:#9a3412; font-size:11px; }
    .kb { fill:#d1d5db; opacity:.6; }
    .tb { fill:#fee2e2; stroke:#dc2626; stroke-width:1.2; } .tbt { fill:#991b1b; font-size:11px; font-weight:600; }
    .ok { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.2; } .okt { fill:#134e4a; font-size:11px; font-weight:600; }
    .ghost { fill:none; stroke:#0f766e; stroke-width:1; stroke-dasharray:3 2; } .ghostt { fill:#0f766e; font-size:10px; }
    .bar { fill:#e5e7eb; stroke:#9ca3af; stroke-width:.8; } .bart { fill:#374151; font-size:10px; }
    .box { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; } .boxt { fill:#134e4a; font-size:12px; font-weight:600; }
    .arr { stroke:#6b7280; stroke-width:1.2; fill:none; }
    .lab { fill:#dc2626; font-size:11px; } .labg { fill:#0f766e; font-size:11px; }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .axis { stroke:#6b7280; } .doc { fill:#1f2937; stroke:#6b7280; } .frame { stroke:#6b7280; } .line { stroke:#374151; }
      .vv { fill:#3b2a12; stroke:#fb923c; } .vvbad { stroke:#f87171; } .vvt { fill:#fdba74; }
      .kb { fill:#4b5563; }
      .tb { fill:#7f1d1d; stroke:#f87171; } .tbt { fill:#fecaca; }
      .ok { fill:#134e4a; stroke:#2dd4bf; } .okt { fill:#ccfbf1; }
      .ghost { stroke:#2dd4bf; } .ghostt { fill:#2dd4bf; }
      .bar { fill:#374151; stroke:#6b7280; } .bart { fill:#e5e7eb; }
      .box { fill:#134e4a; stroke:#2dd4bf; } .boxt { fill:#ccfbf1; }
      .arr { stroke:#9ca3af; } .lab { fill:#f87171; } .labg { fill:#2dd4bf; }
    }
  </style>
  <defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <text class="th" x="340" y="24" text-anchor="middle">세로축 = 문서 (문서는 고정, 창이 움직임)</text>
  <text class="th" x="170" y="52" text-anchor="middle">키보드 뜨고 툴바 밀어둔 직후</text>
  <line class="axis" x1="70" y1="66" x2="70" y2="420"/>
  <text class="ts" x="62" y="72" text-anchor="end">0</text><text class="ts" x="62" y="252" text-anchor="end">450</text><text class="ts" x="62" y="412" text-anchor="end">1200</text>
  <rect class="doc" x="80" y="66" width="120" height="350" rx="4"/><line class="line" x1="96" y1="96" x2="184" y2="96"/><line class="line" x1="96" y1="120" x2="170" y2="120"/><line class="line" x1="96" y1="144" x2="184" y2="144"/><line class="line" x1="96" y1="190" x2="160" y2="190"/><line class="line" x1="96" y1="300" x2="184" y2="300"/><line class="line" x1="96" y1="340" x2="170" y2="340"/><line class="line" x1="96" y1="380" x2="184" y2="380"/>
  <rect class="vv" x="76" y="68" width="128" height="180" rx="4"/>
  <text class="vvt" x="140" y="160" text-anchor="middle">창 0~450</text>
  <rect class="ok" x="86" y="232" width="108" height="14" rx="3"/><text class="okt" x="140" y="243" text-anchor="middle">툴바 450 ✓</text>
  <text class="lab" x="212" y="72">← 창 윗변 = 0</text><text class="tm" x="212" y="86">offsetTop 0</text>
  <text class="labg" x="212" y="252">← 창 아랫변 = 450</text><text class="tm" x="212" y="266">툴바가 딱 맞음</text>

  <text class="th" x="510" y="52" text-anchor="middle">본문을 100 스크롤한 뒤</text>
  <line class="axis" x1="410" y1="66" x2="410" y2="420"/>
  <text class="ts" x="402" y="72" text-anchor="end">0</text><text class="ts" x="402" y="112" text-anchor="end">100</text><text class="ts" x="402" y="252" text-anchor="end">450</text><text class="ts" x="402" y="292" text-anchor="end">550</text><text class="ts" x="402" y="412" text-anchor="end">1200</text>
  <rect class="doc" x="420" y="66" width="120" height="350" rx="4"/><line class="line" x1="436" y1="96" x2="524" y2="96"/><line class="line" x1="436" y1="120" x2="510" y2="120"/><line class="line" x1="436" y1="144" x2="524" y2="144"/><line class="line" x1="436" y1="190" x2="500" y2="190"/><line class="line" x1="436" y1="300" x2="524" y2="300"/><line class="line" x1="436" y1="340" x2="510" y2="340"/><line class="line" x1="436" y1="380" x2="524" y2="380"/>
  <rect class="vv" x="416" y="108" width="128" height="180" rx="4"/>
  <text class="vvt" x="480" y="150" text-anchor="middle">창 100~550</text>
  <rect class="tb" x="426" y="232" width="108" height="14" rx="3"/><text class="tbt" x="480" y="243" text-anchor="middle">툴바 450 ✗</text>
  <rect class="ghost" x="426" y="272" width="108" height="14" rx="3"/><text class="ghostt" x="480" y="283" text-anchor="middle">여기(550)로 밀어야</text>
  <text class="lab" x="552" y="112">← 창 윗변 = 100</text><text class="tm" x="552" y="126">offsetTop 100</text>
  <text class="lab" x="552" y="252">← 툴바는 450 그대로</text><text class="tm" x="552" y="266">창 안에서 100 위로 뜸</text>
  <text class="labg" x="552" y="292">← 창 아랫변 = 550</text>
  <line class="arr" x1="330" y1="200" x2="380" y2="200" marker-end="url(#ma)"/>
  <text class="tm" x="355" y="190" text-anchor="middle">100 스크롤</text>
  <rect class="box" x="90" y="432" width="500" height="30" rx="8"/>
  <text class="boxt" x="340" y="452" text-anchor="middle">스크롤할 때마다 다시 밀어야 함 · 신호 하나만 안 와도 툴바는 450에 남음</text>
</svg>