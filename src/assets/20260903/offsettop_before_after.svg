<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">offsetTop — 스크롤 전과 후 (세로축 = 문서)</title>
  <desc id="d">세로축은 문서. 왼쪽 스크롤 전: 창이 문서 0에서 450까지, offsetTop 0, 툴바를 450에. 오른쪽 키보드 뜬 채 100 스크롤 후: 창이 문서 100에서 550까지, offsetTop 100, 툴바를 550에. 창 크기(height 450)는 같고 문서 위 위치만 100 내려옴</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:14px; font-weight:700; }
    .ts { fill:#111827; font-size:12px; }
    .tm { fill:#6b7280; font-size:11px; }
    .axis { stroke:#9ca3af; stroke-width:1; }
    .doc { fill:#f3f4f6; stroke:#9ca3af; stroke-width:1; }
    .line { stroke:#d1d5db; stroke-width:4; stroke-linecap:round; }
    .vv { fill:#fff7ed; stroke:#f97316; stroke-width:2; stroke-dasharray:5 4; fill-opacity:.6; }
    .vvt { fill:#9a3412; font-size:11px; }
    .kb { fill:#d1d5db; opacity:.6; }
    .tb { fill:#fee2e2; stroke:#dc2626; stroke-width:1.2; } .tbt { fill:#991b1b; font-size:11px; font-weight:600; }
    .ghost { fill:none; stroke:#0f766e; stroke-width:1; stroke-dasharray:3 2; } .ghostt { fill:#0f766e; font-size:10px; }
    .box { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; } .boxt { fill:#134e4a; font-size:12px; font-weight:600; }
    .arr { stroke:#6b7280; stroke-width:1.2; fill:none; }
    .lab { fill:#dc2626; font-size:11px; }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .axis { stroke:#6b7280; } .doc { fill:#1f2937; stroke:#6b7280; } .line { stroke:#374151; }
      .vv { fill:#3b2a12; stroke:#fb923c; } .vvt { fill:#fdba74; }
      .kb { fill:#4b5563; }
      .tb { fill:#7f1d1d; stroke:#f87171; } .tbt { fill:#fecaca; }
      .ghost { stroke:#2dd4bf; } .ghostt { fill:#2dd4bf; }
      .box { fill:#134e4a; stroke:#2dd4bf; } .boxt { fill:#ccfbf1; }
      .arr { stroke:#9ca3af; } .lab { fill:#f87171; }
    }
  </style>
  <defs><marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <text class="th" x="340" y="24" text-anchor="middle">세로축 = 문서 (문서는 고정, 창이 움직임)</text>

  <!-- 왼쪽: 스크롤 전 -->
  <text class="th" x="170" y="52" text-anchor="middle">스크롤 전</text>
  <line class="axis" x1="70" y1="66" x2="70" y2="420"/>
  <text class="ts" x="62" y="72" text-anchor="end">0</text>
  <text class="ts" x="62" y="252" text-anchor="end">450</text>
  <text class="ts" x="62" y="412" text-anchor="end">1200</text>
  <rect class="doc" x="80" y="66" width="120" height="350" rx="4"/>
  <line class="line" x1="96" y1="96" x2="184" y2="96"/><line class="line" x1="96" y1="120" x2="170" y2="120"/><line class="line" x1="96" y1="144" x2="184" y2="144"/><line class="line" x1="96" y1="190" x2="160" y2="190"/><line class="line" x1="96" y1="300" x2="184" y2="300"/><line class="line" x1="96" y1="340" x2="170" y2="340"/><line class="line" x1="96" y1="380" x2="184" y2="380"/>
  <text class="tm" x="140" y="82" text-anchor="middle">문서</text>
  <rect class="vv" x="76" y="68" width="128" height="180" rx="4"/>
  <text class="vvt" x="140" y="160" text-anchor="middle">창 (visual viewport)</text>
  <rect class="tb" x="86" y="232" width="108" height="14" rx="3"/><text class="tbt" x="140" y="243" text-anchor="middle">툴바 → 450</text>
  <text class="lab" x="212" y="72">← 창 윗변 = 문서 0</text>
  <text class="tm" x="212" y="86">offsetTop = 0</text>
  <text class="lab" x="212" y="252">← 창 아랫변 = 문서 450</text>
  <text class="tm" x="212" y="266">= 0 + height 450</text>

  <!-- 오른쪽: 스크롤 후 -->
  <text class="th" x="510" y="52" text-anchor="middle">키보드 뜬 채 100 스크롤 후</text>
  <line class="axis" x1="410" y1="66" x2="410" y2="420"/>
  <text class="ts" x="402" y="72" text-anchor="end">0</text>
  <text class="ts" x="402" y="112" text-anchor="end">100</text>
  <text class="ts" x="402" y="292" text-anchor="end">550</text>
  <text class="ts" x="402" y="412" text-anchor="end">1200</text>
  <rect class="doc" x="420" y="66" width="120" height="350" rx="4"/>
  <line class="line" x1="436" y1="96" x2="524" y2="96"/><line class="line" x1="436" y1="120" x2="510" y2="120"/><line class="line" x1="436" y1="144" x2="524" y2="144"/><line class="line" x1="436" y1="190" x2="500" y2="190"/><line class="line" x1="436" y1="300" x2="524" y2="300"/><line class="line" x1="436" y1="340" x2="510" y2="340"/><line class="line" x1="436" y1="380" x2="524" y2="380"/>
  <text class="tm" x="480" y="82" text-anchor="middle">같은 문서</text>
  <rect class="vv" x="416" y="108" width="128" height="180" rx="4"/>
  <text class="vvt" x="480" y="200" text-anchor="middle">창 (크기 그대로)</text>
  <rect class="ghost" x="426" y="232" width="108" height="14" rx="3"/><text class="ghostt" x="480" y="243" text-anchor="middle">안 밀면 여기 남음</text>
  <rect class="tb" x="426" y="272" width="108" height="14" rx="3"/><text class="tbt" x="480" y="283" text-anchor="middle">툴바 → 550</text>
  <text class="lab" x="552" y="112">← 창 윗변 = 문서 100</text>
  <text class="tm" x="552" y="126">offsetTop = 100</text>
  <text class="lab" x="552" y="292">← 창 아랫변 = 문서 550</text>
  <text class="tm" x="552" y="306">= 100 + height 450</text>

  <line class="arr" x1="330" y1="200" x2="380" y2="200" marker-end="url(#ma)"/>
  <text class="tm" x="355" y="190" text-anchor="middle">100 밀기</text>

  <rect class="box" x="120" y="432" width="440" height="30" rx="8"/>
  <text class="boxt" x="340" y="452" text-anchor="middle">툴바 자리 = offsetTop + height · 창 크기는 같고 문서 위 위치만 바뀜</text>
</svg>
