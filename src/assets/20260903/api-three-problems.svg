<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="680" height="352" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Visual Viewport API 우회가 흔들리는 세 가지 문제 — 기대와 실제</title>
  <desc id="d">1 스크롤하면 키보드 위 툴바가 문서와 함께 흘러간다. 2 iOS 26에서는 키보드를 닫아도 API가 창의 옛 위치를 보고해 툴바가 화면 밖으로 밀린다. 3 웹에서는 키보드 위 자리를 Safari 주소창과 도구툴바가 먼저 차지한다</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:13.5px; font-weight:700; }
    .ts { fill:#111827; font-size:11.5px; }
    .tm { fill:#6b7280; font-size:11px; }
    .frame { fill:none; stroke:#9ca3af; stroke-width:1.4; }
    .body { stroke:#d1d5db; stroke-width:3.5; stroke-linecap:round; }
    .kb { fill:#d1d5db; opacity:.5; }
    .ok { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.1; } .okt { fill:#134e4a; font-size:11px; font-weight:600; }
    .bad { fill:#fee2e2; stroke:#dc2626; stroke-width:1.1; } .badt { fill:#991b1b; font-size:11px; font-weight:600; }
    .ghost { fill:none; stroke:#dc2626; stroke-width:1; stroke-dasharray:4 3; }
    .vwin { fill:none; stroke:#0f766e; stroke-width:1.6; } .vwin-bad { fill:none; stroke:#dc2626; stroke-width:1.6; }
    .bar { fill:#e5e7eb; stroke:#9ca3af; stroke-width:.8; } .bart { fill:#374151; font-size:9.5px; }
    .arr { stroke:#6b7280; stroke-width:1.3; fill:none; }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .frame { stroke:#6b7280; } .body { stroke:#374151; } .kb { fill:#4b5563; }
      .ok { fill:#134e4a; stroke:#2dd4bf; } .okt { fill:#ccfbf1; }
      .bad { fill:#7f1d1d; stroke:#f87171; } .badt { fill:#fecaca; }
      .ghost { stroke:#f87171; } .vwin { stroke:#2dd4bf; } .vwin-bad { stroke:#f87171; }
      .bar { fill:#374151; stroke:#6b7280; } .bart { fill:#e5e7eb; } .arr { stroke:#9ca3af; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="113.0" y="28" text-anchor="middle">1. 스크롤하면 흘러감</text>
<text class="tm" x="56.0" y="250" text-anchor="middle">기대</text>
<text class="tm" x="170.0" y="250" text-anchor="middle">실제 (스크롤 후)</text>
<rect class="frame" x="10" y="44" width="92" height="190" rx="10"/>
<line class="body" x1="22" y1="64" x2="90" y2="64"/><line class="body" x1="22" y1="80" x2="72" y2="80"/>
<rect class="kb" x="11" y="164" width="90" height="68"/><rect class="ok" x="16" y="142" width="80" height="18" rx="4"/><text class="okt" x="56.0" y="155" text-anchor="middle">툴바</text><rect class="frame" x="124" y="44" width="92" height="190" rx="10"/>
<line class="body" x1="136" y1="64" x2="204" y2="64"/><line class="body" x1="136" y1="80" x2="186" y2="80"/>
<rect class="kb" x="125" y="164" width="90" height="68"/><rect class="ghost" x="130" y="142" width="80" height="18" rx="4"/><rect class="bad" x="130" y="96" width="80" height="18" rx="4"/><text class="badt" x="170.0" y="109" text-anchor="middle">툴바</text><line class="arr" x1="170.0" y1="138" x2="170.0" y2="118" marker-end="url(#a)"/><text class="ts" x="113.0" y="278" text-anchor="middle">스크롤할 때마다 다시 밀어야 함</text>
<text class="ts" x="113.0" y="295" text-anchor="middle">신호 하나 놓치면 흘러간 채 남음</text>
<text class="th" x="339.0" y="28" text-anchor="middle">2. iOS 26 — API가 옛 위치를 보고</text>
<text class="tm" x="282.0" y="250" text-anchor="middle">기대 (키보드 닫힘)</text>
<text class="tm" x="396.0" y="250" text-anchor="middle">실제</text>
<rect class="frame" x="236" y="44" width="92" height="190" rx="10"/>
<line class="body" x1="248" y1="64" x2="316" y2="64"/><line class="body" x1="248" y1="80" x2="298" y2="80"/>
<rect class="vwin" x="242" y="88" width="80" height="130" rx="4"/><rect class="vwin" x="242" y="88" width="80" height="130" rx="4" stroke-dasharray="4 3"/><text class="okt" x="282.0" y="140" text-anchor="middle" style="font-size:9.5px">API가 알려준 창</text><text class="okt" x="282.0" y="154" text-anchor="middle" style="font-size:9.5px">= 실제 창</text><rect class="ok" x="246" y="195" width="72" height="18" rx="4"/><text class="okt" x="282.0" y="208" text-anchor="middle">툴바</text><rect class="frame" x="350" y="44" width="92" height="190" rx="10"/>
<line class="body" x1="362" y1="64" x2="430" y2="64"/><line class="body" x1="362" y1="80" x2="412" y2="80"/>
<text class="badt" x="396.0" y="58" text-anchor="middle" style="font-size:8px">offsetTop 0 → 100</text><text class="badt" x="396.0" y="69" text-anchor="middle" style="font-size:8px">iOS 버그로 오작동</text><rect class="vwin-bad" x="356" y="112" width="80" height="130" rx="4" stroke-dasharray="4 3"/><text class="badt" x="396.0" y="160" text-anchor="middle" style="font-size:9.5px">iOS 버그로 인한</text><text class="badt" x="396.0" y="174" text-anchor="middle" style="font-size:9.5px">API의 잘못된</text><text class="badt" x="396.0" y="188" text-anchor="middle" style="font-size:9.5px">값 보고</text><rect class="bad" x="360" y="219" width="72" height="18" rx="4"/><text class="badt" x="396.0" y="232" text-anchor="middle">툴바</text><text class="tm" x="445" y="91" style="font-size:9px">0</text><text class="badt" x="445" y="115" style="font-size:9px">100</text><text class="tm" x="445" y="221" style="font-size:9px">700</text><text class="badt" x="445" y="245" style="font-size:9px">800</text><text class="ts" x="339.0" y="278" text-anchor="middle">iOS 버그로 API가 옛 위치를 보고</text>
<text class="ts" x="339.0" y="295" text-anchor="middle">그 말대로 바닥에 두니 화면 밖</text>
<text class="th" x="565.0" y="28" text-anchor="middle">3. 자리가 우리 것이 아님</text>
<text class="tm" x="508.0" y="250" text-anchor="middle">기대</text>
<text class="tm" x="622.0" y="250" text-anchor="middle">실제 (웹)</text>
<rect class="frame" x="462" y="44" width="92" height="190" rx="10"/>
<line class="body" x1="474" y1="64" x2="542" y2="64"/><line class="body" x1="474" y1="80" x2="524" y2="80"/>
<rect class="kb" x="463" y="164" width="90" height="68"/><rect class="ok" x="468" y="142" width="80" height="18" rx="4"/><text class="okt" x="508.0" y="155" text-anchor="middle">툴바</text><rect class="frame" x="576" y="44" width="92" height="190" rx="10"/>
<line class="body" x1="588" y1="64" x2="656" y2="64"/><line class="body" x1="588" y1="80" x2="638" y2="80"/>
<rect class="kb" x="577" y="164" width="90" height="68"/><rect class="bar" x="582" y="143" width="80" height="18" rx="4"/><text class="bart" x="622.0" y="155" text-anchor="middle">Safari 도구툴바</text><rect class="bar" x="582" y="122" width="80" height="18" rx="4"/><text class="bart" x="622.0" y="134" text-anchor="middle">주소창</text><rect class="bad" x="582" y="101" width="80" height="18" rx="4"/><text class="badt" x="622.0" y="114" text-anchor="middle">툴바</text><text class="ts" x="565.0" y="278" text-anchor="middle">밀어도 그 자리는 이미 남의 것</text>
<text class="ts" x="565.0" y="295" text-anchor="middle">세 번째 층으로 밀려남</text>
  <rect class="ok" x="200" y="326" width="14" height="14" rx="3"/><text class="ts" x="220" y="337">기대한 툴바 자리</text>
  <rect class="bad" x="370" y="326" width="14" height="14" rx="3"/><text class="ts" x="390" y="337">실제로 툴바가 가는 자리</text>
</svg>