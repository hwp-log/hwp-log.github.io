<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">layout viewport와 visual viewport — 평소, 키보드가 올라왔을 때, translate로 밀었을 때</title>
  <desc id="d">1단계 평소에는 두 뷰포트가 같은 크기로 겹쳐 있고 toolbar가 바닥에 보인다. 2단계 키보드가 올라오면 iOS는 visual viewport만 줄여 toolbar가 창 밖으로 나간다. 3단계 Visual Viewport API로 창 바닥 위치를 재서 toolbar를 translateY로 밀어 올리면 창 안으로 들어온다</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:13px; font-weight:700; }
    .ts { fill:#111827; font-size:11px; }
    .tm { fill:#6b7280; font-size:11px; }
    .lv { fill:#f3f4f6; stroke:#9ca3af; stroke-width:1.5; }
    .lvt { fill:#374151; font-size:11px; }
    .vv { fill:none; stroke:#f97316; stroke-width:2; stroke-dasharray:5 4; }
    .vvt { fill:#c2410c; font-size:11px; }
    .kb { fill:#d1d5db; opacity:.6; }
    .tb { fill:#fee2e2; stroke:#dc2626; stroke-width:1.5; }
    .tbt { fill:#991b1b; font-size:11px; font-weight:600; }
    .ghost { fill:none; stroke:#dc2626; stroke-width:1; stroke-dasharray:4 3; opacity:.6; }
    .arr { stroke:#6b7280; stroke-width:1.5; fill:none; }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .lv { fill:#1f2937; stroke:#6b7280; } .lvt { fill:#d1d5db; }
      .vv { stroke:#fb923c; } .vvt { fill:#fdba74; }
      .kb { fill:#4b5563; }
      .tb { fill:#7f1d1d; stroke:#f87171; } .tbt { fill:#fecaca; }
      .ghost { stroke:#f87171; }
      .arr { stroke:#9ca3af; }
    }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

  <text class="th" x="120" y="30" text-anchor="middle">1. 평소</text>
  <rect class="lv" x="50" y="50" width="140" height="300" rx="6"/>
  <text class="lvt" x="120" y="70" text-anchor="middle">layout viewport</text>
  <rect class="vv" x="50" y="50" width="140" height="300" rx="6"/>
  <text class="vvt" x="120" y="88" text-anchor="middle">= visual viewport</text>
  <rect class="tb" x="58" y="318" width="124" height="22" rx="4"/><text class="tbt" x="120" y="333" text-anchor="middle">toolbar (보임)</text>
  <text class="tm" x="120" y="380" text-anchor="middle">둘이 같은 크기로 겹침</text>

  <line class="arr" x1="200" y1="200" x2="230" y2="200" marker-end="url(#a)"/>

  <text class="th" x="340" y="30" text-anchor="middle">2. 키보드 올라옴</text>
  <rect class="lv" x="270" y="50" width="140" height="300" rx="6"/>
  <text class="lvt" x="340" y="68" text-anchor="middle">layout viewport (그대로)</text>
  <text class="vvt" x="340" y="84" text-anchor="middle">≠ visual viewport</text>
  <text class="vvt" x="340" y="100" text-anchor="middle">(키보드만큼 줄어듦)</text>
  <rect class="vv" x="270" y="50" width="140" height="180" rx="6"/>
  <rect class="kb" x="270" y="240" width="140" height="110"/>
  <text class="ts" x="340" y="300" text-anchor="middle">키보드</text>
  <rect class="tb" x="278" y="318" width="124" height="22" rx="4"/><text class="tbt" x="340" y="333" text-anchor="middle">toolbar (창 밖)</text>
  <text class="tm" x="340" y="380" text-anchor="middle">layout, toolbar (그대로)</text>

  <line class="arr" x1="420" y1="200" x2="450" y2="200" marker-end="url(#a)"/>

  <text class="th" x="560" y="30" text-anchor="middle">3. translateY로 밀기</text>
  <rect class="lv" x="490" y="50" width="140" height="300" rx="6"/>
  <text class="lvt" x="560" y="70" text-anchor="middle">layout viewport</text>
  <rect class="vv" x="490" y="50" width="140" height="180" rx="6"/>
  <rect class="kb" x="490" y="240" width="140" height="110"/>
  <rect class="tb" x="498" y="204" width="124" height="22" rx="4"/><text class="tbt" x="560" y="219" text-anchor="middle">toolbar (창 안)</text>
  <rect class="ghost" x="498" y="318" width="124" height="22" rx="4"/><text class="tbt" x="560" y="333" text-anchor="middle" opacity=".8">translateY로 이동</text>
  <line class="arr" x1="560" y1="314" x2="560" y2="234" marker-end="url(#a)"/>
  <text class="tm" x="560" y="380" text-anchor="middle">API로 잰 만큼 강제로 올림</text>
</svg>
