<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 250 320 213" width="640" height="426" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">키보드가 올라오면 하단 툴바가 키보드 뒤로 들어간다</title>
  <desc id="d">화면 바닥에 고정한 편집 툴바가, 키보드가 올라오면 키보드 뒤로 가려지는 장면을 반복 재생한다.</desc>
  <style>
    svg {
      --frame: #9ca3af; --body: #d1d5db; --ink: #111827;
      --tb-bg: #f9fafb; --tb-line: #0284c7; --tb-ink: #1f2937;
      --kb-bg: #e5e7eb; --kb-key: #ffffff; --kb-edge: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --frame: #6b7280; --body: #374151; --ink: #e5e7eb;
        --tb-bg: #1f2937; --tb-line: #38bdf8; --tb-ink: #e5e7eb;
        --kb-bg: #374151; --kb-key: #4b5563; --kb-edge: #fbbf24;
      }
    }
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 2; }
    .body { stroke: var(--body); stroke-width: 6; stroke-linecap: round; }
    .caret { fill: var(--ink); }
    .tb { fill: var(--tb-bg); stroke: var(--tb-line); stroke-width: 1.5; }
    .tb-ink { fill: var(--tb-ink); font-size: 12px; font-weight: 700; }
    .tb-icon { fill: none; stroke: var(--tb-line); stroke-width: 1.5; }
    .kb-bg { fill: var(--kb-bg); opacity: .93; }
    .kb-key { fill: var(--kb-key); }
    .kb-edge { stroke: var(--kb-edge); stroke-width: 2; stroke-dasharray: 4 4; }
    .kb { animation: kb 6s ease-in-out infinite; }
    @keyframes kb {
      0%, 25% { transform: translateY(0); }
      37%, 82% { transform: translateY(-124px); }
      94%, 100% { transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .kb { animation: none; transform: translateY(-124px); }
    }
  </style>
  <defs>
    <clipPath id="screen"><rect x="22" y="22" width="256" height="436" rx="26"/></clipPath>
    <pattern id="keys" x="30" y="0" width="26" height="40" patternUnits="userSpaceOnUse">
      <rect class="kb-key" x="2" y="6" width="22" height="30" rx="4"/>
    </pattern>
  </defs>

  <rect class="frame" x="20" y="20" width="260" height="440" rx="28"/>

  <g clip-path="url(#screen)">
    <!-- 본문 줄 + 커서 -->
    <line class="body" x1="50" y1="262" x2="230" y2="262"/>
    <line class="body" x1="50" y1="287" x2="230" y2="287"/>
    <line class="body" x1="50" y1="312" x2="200" y2="312"/>
    <line class="body" x1="50" y1="337" x2="150" y2="337"/>
    <rect class="caret" x="158" y="328" width="2" height="18"/>

    <!-- 하단 고정 툴바 (position: fixed; bottom: 0) -->
    <rect class="tb" x="30" y="398" width="240" height="36" rx="8"/>
    <g class="tb-ink">
      <text x="48" y="421">H2</text>
      <text x="92" y="421">B</text>
      <text x="126" y="421">A+</text>
      <rect class="tb-icon" x="166" y="408" width="16" height="13" rx="2"/>
      <rect class="tb-icon" x="204" y="408" width="16" height="13" rx="2"/>
      <text x="240" y="421">⋯</text>
    </g>

    <!-- 키보드: 올라오면 툴바를 덮는다 -->
    <g class="kb">
      <rect class="kb-bg" x="22" y="460" width="256" height="220"/>
      <line class="kb-edge" x1="22" y1="461" x2="278" y2="461"/>
      <rect x="22" y="466" width="256" height="120" fill="url(#keys)"/>
      <rect class="kb-key" x="70" y="596" width="160" height="30" rx="4"/>
    </g>
  </g>
</svg>
