<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">왜 덜덜거리나 — 신호 사이엔 떠오르고, 신호가 오면 당겨지고 (세로축 = 화면)</title>
  <desc id="d">왼쪽 폰: 키보드가 뜬 채 스크롤하면 툴바가 문서를 따라 위로 떠오르다가, Safari 신호가 올 때만 update가 키보드 위 목표선으로 당긴다. 이게 반복되어 툴바가 톱니처럼 오르내린다. 오른쪽: 시간에 따른 툴바 위치 그래프. 신호(점)가 올 때만 목표선으로 돌아오고 그 사이엔 계속 위로 흘러간다</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill:#111827; font-size:14px; font-weight:700; }
    .ts { fill:#111827; font-size:12px; }
    .tm { fill:#6b7280; font-size:11px; }
    .frame { fill:none; stroke:#9ca3af; stroke-width:1.5; }
    .line { stroke:#d1d5db; stroke-width:4; stroke-linecap:round; }
    .kb { fill:#d1d5db; opacity:.6; }
    .target { stroke:#0f766e; stroke-width:1.5; stroke-dasharray:5 4; }
    .tb { fill:#fee2e2; stroke:#dc2626; stroke-width:1.2; } .tbt { fill:#991b1b; font-size:11px; font-weight:600; }
    .axis { stroke:#9ca3af; stroke-width:1; }
    .graph { fill:none; stroke:#dc2626; stroke-width:2; }
    .sig { fill:#0f766e; }
    .box { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; } .boxt { fill:#134e4a; font-size:12px; font-weight:600; }
    .lab { fill:#dc2626; font-size:11px; } .labg { fill:#0f766e; font-size:11px; }
    .doc { animation: doc 6s linear infinite; }
    .tbmove { animation: tb 6s linear infinite; }
    .s1 { animation: blink1 6s linear infinite; } .s2 { animation: blink2 6s linear infinite; } .s3 { animation: blink3 6s linear infinite; } .s4 { animation: blink4 6s linear infinite; }
    @keyframes doc { from { transform: translateY(0); } to { transform: translateY(-160px); } }
    @keyframes tb {
      0% { transform: translateY(0); } 24.9% { transform: translateY(-40px); } 25% { transform: translateY(0); }
      49.9% { transform: translateY(-40px); } 50% { transform: translateY(0); }
      74.9% { transform: translateY(-40px); } 75% { transform: translateY(0); }
      99.9% { transform: translateY(-40px); } 100% { transform: translateY(0); }
    }
    @keyframes blink1 { 0%,22% { opacity:0; } 25%,32% { opacity:1; } 35%,100% { opacity:0; } }
    @keyframes blink2 { 0%,47% { opacity:0; } 50%,57% { opacity:1; } 60%,100% { opacity:0; } }
    @keyframes blink3 { 0%,72% { opacity:0; } 75%,82% { opacity:1; } 85%,100% { opacity:0; } }
    @keyframes blink4 { 0%,7% { opacity:1; } 10%,97% { opacity:0; } 100% { opacity:1; } }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
      .frame { stroke:#6b7280; } .line { stroke:#374151; } .kb { fill:#4b5563; }
      .target { stroke:#2dd4bf; } .tb { fill:#7f1d1d; stroke:#f87171; } .tbt { fill:#fecaca; }
      .axis { stroke:#6b7280; } .graph { stroke:#f87171; } .sig { fill:#2dd4bf; }
      .box { fill:#134e4a; stroke:#2dd4bf; } .boxt { fill:#ccfbf1; }
      .lab { fill:#f87171; } .labg { fill:#2dd4bf; }
    }
    @media (prefers-reduced-motion: reduce) { .doc, .tbmove, .s1, .s2, .s3, .s4 { animation: none; } .tbmove { transform: translateY(-20px); } }
  </style>
  <defs><clipPath id="scr"><rect x="62" y="62" width="156" height="296" rx="10"/></clipPath></defs>

  <text class="th" x="340" y="24" text-anchor="middle">세로축 = 화면 (키보드 뜬 채 계속 스크롤 중)</text>

  <text class="th" x="140" y="52" text-anchor="middle">화면에서 보이는 것</text>
  <rect class="frame" x="60" y="60" width="160" height="300" rx="12"/>
  <g clip-path="url(#scr)">
    <g class="doc">
      <line class="line" x1="80" y1="90" x2="200" y2="90"/><line class="line" x1="80" y1="114" x2="180" y2="114"/><line class="line" x1="80" y1="138" x2="200" y2="138"/><line class="line" x1="80" y1="162" x2="170" y2="162"/><line class="line" x1="80" y1="186" x2="200" y2="186"/><line class="line" x1="80" y1="210" x2="185" y2="210"/><line class="line" x1="80" y1="234" x2="200" y2="234"/><line class="line" x1="80" y1="258" x2="175" y2="258"/><line class="line" x1="80" y1="282" x2="200" y2="282"/><line class="line" x1="80" y1="306" x2="190" y2="306"/><line class="line" x1="80" y1="330" x2="200" y2="330"/><line class="line" x1="80" y1="354" x2="180" y2="354"/><line class="line" x1="80" y1="378" x2="200" y2="378"/><line class="line" x1="80" y1="402" x2="185" y2="402"/><line class="line" x1="80" y1="426" x2="200" y2="426"/><line class="line" x1="80" y1="450" x2="175" y2="450"/><line class="line" x1="80" y1="474" x2="200" y2="474"/><line class="line" x1="80" y1="498" x2="190" y2="498"/>
    </g>
    <rect class="kb" x="62" y="262" width="156" height="96"/>
    <text class="ts" x="140" y="314" text-anchor="middle">키보드</text>
    <line class="target" x1="62" y1="258" x2="218" y2="258"/>
    <g class="tbmove"><rect class="tb" x="70" y="240" width="140" height="16" rx="3"/><text class="tbt" x="140" y="252" text-anchor="middle">툴바</text></g>
  </g>
  <text class="labg" x="228" y="262">← 목표: 키보드 바로 위</text>
  <text class="lab" x="228" y="226">떠오름 (문서 따라)</text>
  <text class="labg" x="228" y="244">신호 오면 당김</text>

  <text class="th" x="510" y="52" text-anchor="middle">시간에 따른 툴바 위치</text>
  <line class="axis" x1="390" y1="80" x2="390" y2="330"/>
  <line class="axis" x1="390" y1="330" x2="640" y2="330"/>
  <text class="tm" x="640" y="346" text-anchor="end">시간 →</text>
  <line class="target" x1="390" y1="300" x2="640" y2="300"/>
  <text class="labg" x="392" y="294">목표선 (키보드 바로 위)</text>
  <polyline class="graph" points="400,300 450,240 452,300 502,240 504,300 554,240 556,300 606,240 608,300 636,270"/>
  <circle class="sig s4" cx="400" cy="300" r="5"/><circle class="sig s1" cx="452" cy="300" r="5"/><circle class="sig s2" cx="504" cy="300" r="5"/><circle class="sig s3" cx="556" cy="300" r="5"/><circle class="sig" cx="608" cy="300" r="5" opacity=".35"/>
  <text class="labg" x="452" y="322" text-anchor="middle" style="font-size:10px">신호</text><text class="labg" x="504" y="322" text-anchor="middle" style="font-size:10px">신호</text><text class="labg" x="556" y="322" text-anchor="middle" style="font-size:10px">신호</text><text class="labg" x="608" y="322" text-anchor="middle" style="font-size:10px">신호</text>
  <text class="lab" x="480" y="230" text-anchor="middle">신호 사이: 계속 위로 흘러감</text>
  <text class="lab" x="480" y="246" text-anchor="middle">신호 순간: 목표선으로 탁</text>

  <rect class="box" x="90" y="382" width="500" height="30" rx="8"/>
  <text class="boxt" x="340" y="402" text-anchor="middle">떠오름 → 당김 → 떠오름 → 당김 … 이 톱니가 눈에는 덜덜거림으로 보임</text>
</svg>
