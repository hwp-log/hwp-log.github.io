<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">키보드가 올라오면 visual viewport만 줄고 layout viewport는 그대로라 fixed 툴바가 키보드 뒤로 들어간다</title>
  <desc id="d">왼쪽은 폰 화면에서 바닥에 고정한 툴바가 키보드에 가려지는 장면, 오른쪽은 같은 순간 layout viewport(문서 판)는 그대로이고 visual viewport(보이는 영역)만 줄어드는 것을 나타낸 도해. 6초마다 반복.</desc>
  <style>
    svg { --ink:#111827; --muted:#6b7280; --frame:#9ca3af; --line:#d1d5db; --kb:#e5e7eb; --key:#ffffff;
          --tb:#dbeafe; --tb-line:#0284c7; --tb-ink:#1e3a8a; --lv:#f3f4f6; --lv-line:#9ca3af; --vv:#fff7ed; --vv-line:#f97316; --fx:#dc2626; }
    @media (prefers-color-scheme: dark) {
      svg { --ink:#e5e7eb; --muted:#9ca3af; --frame:#6b7280; --line:#374151; --kb:#374151; --key:#4b5563;
            --tb:#1e3a8a; --tb-line:#38bdf8; --tb-ink:#dbeafe; --lv:#1f2937; --lv-line:#6b7280; --vv:#3b2a12; --vv-line:#fb923c; --fx:#f87171; }
    }
    text { font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    .th { fill: var(--ink); font-size: 13px; font-weight: 700; }
    .ts { fill: var(--ink); font-size: 11px; }
    .tm { fill: var(--muted); font-size: 11px; }
    .frame { fill: none; stroke: var(--frame); stroke-width: 2; }
    .body { stroke: var(--line); stroke-width: 5; stroke-linecap: round; }
    .kb-bg { fill: var(--kb); } .key { fill: var(--key); }
    .tb { fill: var(--tb); stroke: var(--tb-line); stroke-width: 1.5; } .tbt { fill: var(--tb-ink); font-size: 11px; font-weight: 700; }
    .lv { fill: var(--lv); stroke: var(--lv-line); stroke-width: 1.5; }
    .vv { fill: var(--vv); stroke: var(--vv-line); stroke-width: 2; stroke-dasharray: 5 4; }
    .fx { fill: var(--fx); }
    .kb { animation: kb 6s ease-in-out infinite; }
    .vvh { animation: vvh 6s ease-in-out infinite; }
    .showB { animation: on 6s ease-in-out infinite; }
    .showA { animation: off 6s ease-in-out infinite; }
    @keyframes kb  { 0%,25% { transform: translateY(0); } 37%,82% { transform: translateY(-120px); } 94%,100% { transform: translateY(0); } }
    @keyframes vvh { 0%,25% { height: 260px; } 37%,82% { height: 140px; } 94%,100% { height: 260px; } }
    @keyframes on  { 0%,25% { opacity: 0; } 37%,82% { opacity: 1; } 94%,100% { opacity: 0; } }
    @keyframes off { 0%,25% { opacity: 1; } 37%,82% { opacity: 0; } 94%,100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .kb { animation: none; transform: translateY(-120px); }
      .vvh { animation: none; height: 140px; }
      .showB { animation: none; opacity: 1; } .showA { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="scr"><rect x="42" y="62" width="176" height="276" rx="16"/></clipPath>
    <pattern id="keys" x="46" y="0" width="22" height="30" patternUnits="userSpaceOnUse"><rect class="key" x="2" y="5" width="18" height="22" rx="3"/></pattern>
  </defs>

  <!-- 왼쪽: 폰 화면 (현상) -->
  <text class="th" x="130" y="40" text-anchor="middle">화면에서 보이는 것</text>
  <rect class="frame" x="40" y="60" width="180" height="280" rx="18"/>
  <g clip-path="url(#scr)">
    <line class="body" x1="60" y1="90" x2="200" y2="90"/><line class="body" x1="60" y1="110" x2="200" y2="110"/><line class="body" x1="60" y1="130" x2="160" y2="130"/>
    <rect class="tb" x="50" y="300" width="160" height="28" rx="6"/><text class="tbt" x="130" y="318" text-anchor="middle">툴바 (fixed; bottom:0)</text>
    <g class="kb">
      <rect class="kb-bg" x="42" y="338" width="176" height="140"/>
      <rect x="42" y="342" width="176" height="90" fill="url(#keys)"/>
      <rect class="key" x="80" y="438" width="100" height="18" rx="3"/>
    </g>
  </g>
  <g class="showB"><text class="ts" x="130" y="365" text-anchor="middle" style="fill:var(--fx);font-weight:700">툴바가 키보드 뒤로</text></g>
  <g class="showA"><text class="tm" x="130" y="365" text-anchor="middle">키보드 내려간 상태</text></g>

  <!-- 오른쪽: 두 뷰포트 (이유) -->
  <text class="th" x="450" y="40" text-anchor="middle">브라우저가 아는 것</text>
  <rect class="lv" x="330" y="60" width="110" height="260" rx="6"/>
  <text class="ts" x="385" y="82" text-anchor="middle">layout viewport</text>
  <text class="tm" x="385" y="98" text-anchor="middle">문서 판 · 안 줄어듦</text>
  <rect class="fx" x="338" y="300" width="94" height="12" rx="3"/>
  <text class="ts" x="385" y="334" text-anchor="middle" style="fill:var(--fx)">툴바가 바닥에 붙음(iOS)</text>

  <rect class="vv vvh" x="470" y="60" width="110" height="260" rx="6"/>
  <text class="ts" x="525" y="82" text-anchor="middle">visual viewport</text>
  <text class="tm" x="525" y="98" text-anchor="middle">보이는 영역 · 줄어듦</text>
  <g class="showB"><text class="tm" x="525" y="250" text-anchor="middle">키보드가 이만큼</text><text class="tm" x="525" y="266" text-anchor="middle">가져감</text></g>

</svg>
