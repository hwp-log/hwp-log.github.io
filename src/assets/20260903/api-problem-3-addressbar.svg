<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="680" height="430" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">문제 3 — 웹에서는 키보드 위 자리를 Safari가 먼저 차지 (세로축 = 화면)</title>
  <desc id="d">왼쪽 Notion App: 키보드 450~750 바로 위 430~450에 툴바. 오른쪽 iOS Safari 웹: 키보드 바로 위를 Safari 도구툴바(410~450)와 주소창(370~410)이 먼저 차지해 툴바는 350~370, 키보드에서 100 떨어진다</desc>
  <style>
