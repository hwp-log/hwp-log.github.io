    .line { stroke:#d1d5db; stroke-width:4; stroke-linecap:round; }
    .vv { fill:#fff7ed; stroke:#f97316; stroke-width:2; stroke-dasharray:5 4; fill-opacity:.6; }
    .vvbad { fill:none; stroke:#dc2626; stroke-width:2; stroke-dasharray:5 4; }
    .vvt { fill:#9a3412; font-size:11px; }
    .kb { fill:#d1d5db; opacity:.6; }
    .tb { fill:#fee2e2; stroke:#dc2626; stroke-width:1.2; } .tbt { fill:#991b1b; font-size:11px; font-weight:600; }
    .ok { fill:#ccfbf1; stroke:#0f766e; stroke-width:1.2; } .okt { fill:#134e4a; font-size:11px; font-weight:600; }
    .ghost { fill:none; stroke:#0f766e; stroke-width:1; stroke-dasharray:3 2; } .ghostt { fill:#0f766e; font-size:10px; }
    .bar { fill:#e5e7eb; stroke:#9ca3af; stroke-width:.8; } .bart { fill:#374151; font-size:10px; }
    .box { fill:#ccfbf1; stroke:#0f766e; stroke-width:1; } .boxt { fill:#134e4a; font-size:12px; font-weight:600; }
    .arr { stroke:#6b7280; stroke-width:1.2; fill:none; }
    .lab { fill:#dc2626; font-size:11px; } .labg { fill:#0f766e; font-size:11px; }
    @media (prefers-color-scheme: dark) {
      .th, .ts { fill:#e5e7eb; } .tm { fill:#9ca3af; }
